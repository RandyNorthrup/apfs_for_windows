name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "apfs-for-windows-v*"

permissions:
  contents: write
  id-token: write

jobs:
  release-build:
    runs-on: windows-2022
    timeout-minutes: 90
    # The Azure federated credential trusts this environment only
    # (repo:RandyNorthrup/apfs_for_windows:environment:release).
    environment: release
    steps:
      - name: Check out sanitized source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Verify repository privacy and governance
        shell: powershell
        run: |
          .\scripts\verify-repository-privacy.ps1
          .\scripts\verify-repository-hygiene.ps1 -RequireCleanWorktree
          .\scripts\verify-sak-source-boundary.ps1 -RequireUpstream:$false
          .\scripts\verify-winfsp-runtime-boundary.ps1
          .\scripts\verify-license-notices.ps1
          .\scripts\verify-release-policy.ps1
          .\scripts\verify-release-governance.ps1

      - name: Validate version and release tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION is not semantic: $version"
          }
          $notes = "docs/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes are missing: $notes"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $expectedTag = "apfs-for-windows-v$version"
            if ($env:GITHUB_REF_NAME -cne $expectedTag) {
              throw "Release tag must be $expectedTag, got $env:GITHUB_REF_NAME"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "package=APFS-for-Windows-$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 -O C:\Qt
          if (-not (Test-Path 'C:\Qt\6.10.3\msvc2022_64\bin\Qt6Core.dll')) {
            throw 'Qt installation is incomplete.'
          }

      # Official, production-signed WinFsp pinned in dependencies/winfsp.json:
      # download, verify SHA-256 and signatures, admin-extract, stage the SDK.
      - name: Stage official WinFsp SDK
        id: winfsp
        shell: pwsh
        run: |
          . .\scripts\lib\winfsp-sdk.ps1
          $sdk = Get-ApfsWinFspSdk
          .\scripts\verify-winfsp-runtime-boundary.ps1 -SdkRoot $sdk.SdkRoot | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Staged WinFsp SDK failed verification.' }
          "root=$($sdk.SdkRoot)" >> $env:GITHUB_OUTPUT
          "bin=$($sdk.BinDir)" >> $env:GITHUB_OUTPUT
          "msi=$($sdk.MsiPath)" >> $env:GITHUB_OUTPUT

      - name: Configure and build APFS for Windows
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_PREFIX_PATH='C:\Qt\6.10.3\msvc2022_64' `
            -DWinFsp_ROOT='${{ steps.winfsp.outputs.root }}' `
            -DAPFS_PRODUCTION_BUILD=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          # The runner has no WinFsp installed; tests load the staged runtime.
          $env:PATH = '${{ steps.winfsp.outputs.bin }};' + $env:PATH
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'CTest failed.' }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          $toolsDir = Join-Path $env:USERPROFILE '.dotnet\tools'
          $toolsDir >> $env:GITHUB_PATH
          $env:PATH = "$toolsDir;$env:PATH"
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2 WixToolset.Bal.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX extension installation failed.' }

      # Log in only after the long build so the Azure CLI token is fresh for signing.
      - name: Azure login for Artifact Signing
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build, sign, and verify release payload
        shell: pwsh
        run: |
          .\scripts\build-release-package.ps1 `
            -BuildDir build\Release `
            -QtBin C:\Qt\6.10.3\msvc2022_64\bin `
            -Sign
          .\scripts\verify-release-package.ps1 -RequireSigned `
            -OutputPath artifacts\package\verify-release-package-ps7.json
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 package verification failed.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File `
            .\scripts\verify-release-package.ps1 -RequireSigned `
            -OutputPath artifacts\package\verify-release-package-ps5.json
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 package verification failed.' }
          $stage = "artifacts\package\${{ steps.version.outputs.package }}"
          .\scripts\verify-repository-privacy.ps1 -ScanRoot $stage `
            -SkipGitMetadata -OutputPath artifacts\package\package-privacy.json

      - name: Build and sign MSI and Setup.exe
        shell: pwsh
        run: |
          .\scripts\build-msi.ps1 -Sign -WinFspMsi '${{ steps.winfsp.outputs.msi }}' | Out-Host
          $assets = @(
            "artifacts\package\${{ steps.version.outputs.package }}-Setup.exe",
            "artifacts\package\${{ steps.version.outputs.package }}.msi"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Installer was not produced: $asset"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $asset
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or
                -not ([string]$signature.SignerCertificate.Subject).StartsWith('CN=Randy Northrup')) {
              throw "Installer signature is not valid: $asset ($($signature.Status))"
            }
          }
          $sums = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          $sums | Set-Content artifacts\package\SHA256SUMS.txt -Encoding ASCII

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.package }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/package/${{ steps.version.outputs.package }}-Setup.exe
            artifacts/package/${{ steps.version.outputs.package }}.msi
            artifacts/package/package-proof.json
            artifacts/package/package-privacy.json
            artifacts/package/verify-release-package-ps5.json
            artifacts/package/verify-release-package-ps7.json
            artifacts/package/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "APFS for Windows ${{ steps.version.outputs.version }}"
          $notes = '${{ steps.version.outputs.notes }}'
          $assets = @(
            "artifacts\package\${{ steps.version.outputs.package }}-Setup.exe",
            "artifacts\package\${{ steps.version.outputs.package }}.msi",
            'artifacts\package\SHA256SUMS.txt'
          )
          gh release create $tag @assets --verify-tag --latest `
            --title $title --notes-file $notes
